apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-detection-mlops
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/rohansawantred/mlops-gitops.git
    targetRevision: master
    path: fraud-detection-mlops/charts/fraud-detection-mlops
    helm:
      valueFiles:
        - values.yaml
        - examples/values-s3.yaml
      parameters:
        # Separate from existing fraud-mlops demo app on this cluster
        - name: namespace
          value: fraud-detection-mlops
        - name: createNamespace
          value: "false"
        # Enable after pipeline/inference image is built on the cluster
        - name: pipeline.enableSubmitJob
          value: "false"
        - name: inference.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: fraud-detection-mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
