apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fraud.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fraud.labels" . | nindent 4 }}
data:
  DATA_SOURCE_TYPE: {{ .Values.dataSource.type | quote }}
  FEAST_REPO_PATH: {{ .Values.feast.repoPath | quote }}
  FEAST_REGISTRY_PATH: {{ .Values.feast.registryPath | quote }}
  FEAST_ONLINE_STORE_TYPE: {{ .Values.feast.onlineStoreType | quote }}
  FEAST_REDIS_CONNECTION_STRING: {{ .Values.feast.redisConnectionString | quote }}
  FEAST_MATERIALIZE_DAYS: {{ .Values.feast.materializeDays | quote }}
  MLFLOW_TRACKING_URI: {{ .Values.mlflow.trackingUri | quote }}
  MLFLOW_EXPERIMENT_NAME: {{ .Values.mlflow.experimentName | quote }}
  MODEL_URI: {{ .Values.inference.modelUri | quote }}
  FRAUD_THRESHOLD: {{ .Values.inference.threshold | quote }}
  {{- if eq .Values.dataSource.type "s3" }}
  FEAST_S3_BUCKET: {{ .Values.dataSource.s3.bucket | quote }}
  FEAST_S3_PREFIX: {{ .Values.dataSource.s3.prefix | quote }}
  FEAST_S3_ENDPOINT: {{ .Values.dataSource.s3.endpoint | quote }}
  AWS_DEFAULT_REGION: {{ .Values.dataSource.s3.region | quote }}
  {{- else if eq .Values.dataSource.type "sql" }}
  FEAST_SQL_SCHEMA: {{ .Values.dataSource.sql.schema | quote }}
  FEAST_SQL_TABLE: {{ .Values.dataSource.sql.table | quote }}
  {{- end }}
  PIPELINE_API: {{ .Values.kubeflow.pipelineApi | quote }}
  PIPELINE_MIN_PR_AUC: {{ .Values.pipeline.params.minPrAuc | quote }}
  PIPELINE_MIN_F1: {{ .Values.pipeline.params.minF1 | quote }}
  PIPELINE_MAX_DEPTH: {{ .Values.pipeline.params.maxDepth | quote }}
  PIPELINE_N_ESTIMATORS: {{ .Values.pipeline.params.nEstimators | quote }}
  PIPELINE_LEARNING_RATE: {{ .Values.pipeline.params.learningRate | quote }}
  PIPELINE_RUN_MATERIALIZE: {{ .Values.pipeline.params.runMaterialize | quote }}
