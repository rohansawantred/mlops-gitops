{{- if .Values.secrets.createPlaceholders }}
{{- if eq .Values.dataSource.type "s3" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dataSource.s3.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fraud.labels" . | nindent 4 }}
  annotations:
    mlops.fraud/placeholder: "Replace values with oc create secret or ExternalSecrets"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_ENDPOINT_URL: {{ .Values.dataSource.s3.endpoint | quote }}
{{- else if eq .Values.dataSource.type "sql" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dataSource.sql.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fraud.labels" . | nindent 4 }}
  annotations:
    mlops.fraud/placeholder: "Replace values with oc create secret or ExternalSecrets"
type: Opaque
stringData:
  JDBC_URL: ""
  PGHOST: ""
  PGPORT: "5432"
  PGDATABASE: ""
  PGUSER: ""
  PGPASSWORD: ""
{{- end }}
{{- end }}
