[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-mlops"
version = "0.1.0"
description = "Fraud detection MLOps app for OpenShift (Kubeflow + MLflow + Feast + Argo CD)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["training*", "pipelines*", "inference*", "feast*"]
